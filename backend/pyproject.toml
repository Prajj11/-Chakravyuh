[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "chakravyuh-backend"
version = "0.1.0"
description = "Local evidence and coordination investigation workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.5",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "h3==4.5.0",
  "pillow==13.0.0",
  "python-multipart==0.0.32",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
]

[project.optional-dependencies]
nlp = ["sentence-transformers==5.1.2"]
dev = ["pytest==9.1.1", "ruff==0.17.1", "httpx2==2.13.1", "mypy==2.4.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
