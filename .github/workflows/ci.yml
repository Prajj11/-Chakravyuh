name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python 3.12 / Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend dependencies
        run: python -m pip install -c backend/requirements.lock -e './backend[dev]'
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check backend
        run: |
          python -m pip check
          python -m pytest backend/tests -q
          python -m ruff check backend scripts/smoke.py
          python -m ruff format --check backend scripts/smoke.py
          python -m mypy backend/app --ignore-missing-imports
          python backend/scripts/generate_types.py --check
      - name: Check and build frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run format:check
          npm run build
      - name: Offline CLI smoke
        run: python scripts/smoke.py
      - name: Check POSIX launcher syntax
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/dev.sh
